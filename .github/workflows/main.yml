name: SmartPMS CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'
  SOLUTION_FILE: 'SmartPMS.slnx'
  ANGULAR_DIR: 'SmartPMS.Web'

jobs:

  # ══════════════════════════════════════════════════
  # JOB 1 — Backend CI  (GitHub Cloud, ubuntu-latest)
  # ══════════════════════════════════════════════════
  ci-backend:
    name: 'CI — Backend Build & Test'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --verbosity normal

  # ══════════════════════════════════════════════════
  # JOB 2 — Frontend CI  (GitHub Cloud, ubuntu-latest)
  # ══════════════════════════════════════════════════
  ci-frontend:
    name: 'CI — Angular Build'
    runs-on: ubuntu-latest
    needs: ci-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.ANGULAR_DIR }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ env.ANGULAR_DIR }}
        run: npm ci

      - name: Build Angular (production + SSR)
        working-directory: ${{ env.ANGULAR_DIR }}
        run: npm run build -- --configuration production

  # ══════════════════════════════════════════════════
  # JOB 3 — Deploy CD  (YOUR LOCAL PC)
  #   Runs ONLY on push to master, after CI passes
  # ══════════════════════════════════════════════════
  cd-deploy:
    name: 'CD — Deploy to Local Machine'
    runs-on: self-hosted
    needs: [ ci-backend, ci-frontend ]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      # ── Stop any previously running services ──────
      - name: Stop old services
        shell: powershell
        run: |
          Write-Host "Stopping old SmartPMS processes..."
          $dotnetProcs = @(
            'SmartPMS.ApiGateway',
            'SmartPMS.IdentityService',
            'SmartPMS.EmployeeService',
            'SmartPMS.PerformancePlanService',
            'SmartPMS.SelfAppraisalService'
          )
          foreach ($name in $dotnetProcs) {
            $proc = Get-Process -Name $name -ErrorAction SilentlyContinue
            if ($proc) {
              Stop-Process -Name $name -Force
              Write-Host "  Stopped: $name"
            }
          }
          # Kill any node process serving server.mjs (Angular SSR)
          Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'node.exe' -and $_.CommandLine -like '*server.mjs*'
          } | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            Write-Host "  Stopped: node.exe (Angular SSR)"
          }
          Start-Sleep -Seconds 3
          Write-Host "All old services stopped."

      # ── Build backend ─────────────────────────────
      - name: Restore & Build Backend
        shell: powershell
        run: |
          Write-Host "Building backend..."
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
          Write-Host "Backend build complete."

      # ── Start all .NET microservices ──────────────
      - name: Start All Backend Services
        shell: powershell
        run: |
          $root = "${{ github.workspace }}"

          Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "`"$root\SmartPMS.IdentityService\bin\Release\net10.0\SmartPMS.IdentityService.exe`" --urls `"https://0.0.0.0:7024;http://0.0.0.0:5001`" --environment Development"
            CurrentDirectory = "$root\SmartPMS.IdentityService"
          }

          Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "`"$root\SmartPMS.EmployeeService\bin\Release\net10.0\SmartPMS.EmployeeService.exe`" --urls `"https://0.0.0.0:7158;http://0.0.0.0:5002`" --environment Development"
            CurrentDirectory = "$root\SmartPMS.EmployeeService"
          }

          Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "`"$root\SmartPMS.PerformancePlanService\bin\Release\net10.0\SmartPMS.PerformancePlanService.exe`" --urls `"https://0.0.0.0:7216;http://0.0.0.0:5003`" --environment Development"
            CurrentDirectory = "$root\SmartPMS.PerformancePlanService"
          }

          Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "`"$root\SmartPMS.SelfAppraisalService\bin\Release\net10.0\SmartPMS.SelfAppraisalService.exe`" --urls `"https://0.0.0.0:7286;http://0.0.0.0:5004`" --environment Development"
            CurrentDirectory = "$root\SmartPMS.SelfAppraisalService"
          }

          Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "`"$root\SmartPMS.ApiGateway\bin\Release\net10.0\SmartPMS.ApiGateway.exe`" --urls `"https://0.0.0.0:7223;http://0.0.0.0:5157`" --environment Development"
            CurrentDirectory = "$root\SmartPMS.ApiGateway"
          }

          Write-Host "All 5 backend microservices started successfully (detached)."

      # ── Build & Start Angular SSR frontend ────────
      - name: Install Angular dependencies
        shell: powershell
        working-directory: ${{ env.ANGULAR_DIR }}
        run: npm ci

      - name: Build Angular SSR (production)
        shell: powershell
        working-directory: ${{ env.ANGULAR_DIR }}
        run: npm run build -- --configuration production

      - name: Start Angular SSR Server
        shell: powershell
        working-directory: ${{ env.ANGULAR_DIR }}
        run: |
          $webDir = "${{ github.workspace }}\${{ env.ANGULAR_DIR }}"
          $serverFile = "$webDir\dist\SmartPMS.Web\server\server.mjs"
          Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "cmd.exe /c set PORT=4000&& set NG_ALLOWED_HOSTS=*&& node `"$serverFile`""
            CurrentDirectory = $webDir
          }
          Write-Host "Angular SSR frontend started on port 4000 (detached)."

      # ── Wait for services to boot ─────────────────
      - name: Wait for services to boot
        shell: powershell
        run: |
          Write-Host "Waiting 20 seconds for all services to boot..."
          Start-Sleep -Seconds 20

      # ── Health checks ─────────────────────────────
      - name: Health Check — API Gateway
        shell: powershell
        run: |
          try {
            $res = Invoke-WebRequest -Uri "https://localhost:7223/gateway/health" `
              -SkipCertificateCheck -TimeoutSec 10 -UseBasicParsing
            Write-Host "API Gateway OK: $($res.StatusCode)"
          } catch {
            Write-Host "API Gateway not responding yet: $($_.Exception.Message)"
          }

      - name: Health Check — Identity Service
        shell: powershell
        run: |
          try {
            $res = Invoke-WebRequest -Uri "https://localhost:7024/api/auth/health" `
              -SkipCertificateCheck -TimeoutSec 10 -UseBasicParsing
            Write-Host "Identity Service OK: $($res.StatusCode)"
          } catch {
            Write-Host "Identity Service not responding yet: $($_.Exception.Message)"
          }

      - name: Health Check — Angular Frontend
        shell: powershell
        run: |
          try {
            $res = Invoke-WebRequest -Uri "http://localhost:4000" `
              -TimeoutSec 10 -UseBasicParsing
            Write-Host "Angular Frontend OK: $($res.StatusCode)"
          } catch {
            Write-Host "Angular Frontend not responding yet: $($_.Exception.Message)"
          }

      # ── Deployment summary ────────────────────────
      - name: Deployment Summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "   SmartPMS Deployed to Local Machine!"
          Write-Host "   Commit: ${{ github.sha }}"
          Write-Host "   Branch: ${{ github.ref_name }}"
          Write-Host "=============================================="
          Write-Host "   Frontend (Angular SSR)   : http://localhost:4000"
          Write-Host "   API Gateway (YARP)        : https://localhost:7223"
          Write-Host "   Identity Service          : https://localhost:7024"
          Write-Host "   Employee Service          : https://localhost:7158"
          Write-Host "   PerformancePlan Service   : https://localhost:7216"
          Write-Host "   SelfAppraisal Service     : https://localhost:7286"
          Write-Host "=============================================="
